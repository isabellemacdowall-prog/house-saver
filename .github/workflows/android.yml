name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: gradle -p android assembleRelease
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/house/release/app-house-release.apk HouseSaver.apk
          cp android/app/build/outputs/apk/mine/release/app-mine-release.apk MySpending.apk
      - uses: actions/upload-artifact@v4
        with: { name: apps, path: '*.apk' }
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: House Saver app
          body: |
            HouseSaver.apk opens the shared house plan. MySpending.apk opens only your private spending.
            Download on your Android phone and open to install.
          files: |
            HouseSaver.apk
            MySpending.apk
          make_latest: true
