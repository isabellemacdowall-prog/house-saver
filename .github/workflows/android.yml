name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: gradle -p android assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk HouseSaver.apk
      - uses: actions/upload-artifact@v4
        with: { name: HouseSaver-apk, path: HouseSaver.apk }
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: House Saver app
          body: Download HouseSaver.apk on your Android phone and open it to install.
          files: HouseSaver.apk
          make_latest: true
