plugins { id 'com.android.application' }
android {
    namespace 'io.github.isabellemacdowall.housesaver'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.isabellemacdowall.housesaver'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        // A fixed key so each new build installs over the previous one.
        release {
            storeFile file('housesaver.keystore')
            storePassword 'housesaver'
            keyAlias 'housesaver'
            keyPassword 'housesaver'
        }
    }
    flavorDimensions = ['app']
    productFlavors {
        house {
            dimension 'app'
            applicationId 'io.github.isabellemacdowall.housesaver'
        }
        mine {
            dimension 'app'
            applicationId 'io.github.isabellemacdowall.myspending'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
